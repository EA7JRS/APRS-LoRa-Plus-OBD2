; APRS LoRa+ OBD-II: XIAO ESP32-S3 + kit CAN. Lee el OBD-II del coche (MCP2515, 500 kbit/s) y emite los datos de motor al
; bus NMEA 2000 (TWAI nativo + transceptor externo, 250 kbit/s) para los plotters (APRS LoRa+ y Garmin).
[platformio]
default_envs = xiao_esp32s3_obd2

[env:xiao_esp32s3_obd2]
platform = espressif32 @ 8.0.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DOBD2_VERSION=\"5.4.7\"   ; el mismo numero que el resto del ecosistema APRS LoRa+
lib_deps =
    https://github.com/ttlappalainen/CAN_BUS_Shield.git#0cd860338efb30c3fe963268530bdc726b6783e4
    bblanchon/ArduinoJson@7.4.3
    h2zero/NimBLE-Arduino@2.5.2
