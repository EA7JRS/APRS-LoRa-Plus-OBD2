name: build
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas del núcleo en el PC
        run: make -C test_host run
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -U platformio
      - name: Compilar el firmware
        run: pio run -e xiao_esp32s3_obd2
      - uses: actions/upload-artifact@v4
        with:
          name: obd2-firmware
          path: .pio/build/xiao_esp32s3_obd2/firmware.bin
          if-no-files-found: ignore
